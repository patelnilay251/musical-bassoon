<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paloma Bay</title>
<meta name="description" content="A seaside town painted by a from-scratch software renderer, one picture at a time. Drag across it to pass the day.">
<style>
  :root {
    --ink: rgba(255, 253, 247, 0.92);
    --ink-soft: rgba(255, 253, 247, 0.62);
    --shadow: 0 1px 14px rgba(8, 14, 60, 0.28), 0 0 2px rgba(8, 14, 60, 0.18);
    --font: "Futura", "Futura PT", "Century Gothic", "Avenir Next", "Avenir", "Trebuchet MS", system-ui, sans-serif;
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #efe6d6;
    color: var(--ink);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    display: block;
  }
  #paint {
    touch-action: none;
    cursor: ew-resize;
  }
  #fade {
    pointer-events: none;
    background: #efe6d6;
  }
  .caption {
    position: fixed;
    left: max(28px, 3.2vw);
    bottom: max(30px, 4.2vh);
    color: var(--ink);
    text-shadow: var(--shadow);
    pointer-events: none;
    user-select: none;
  }
  .town {
    font-size: 11px;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 7px;
  }
  .where {
    font-size: clamp(17px, 1.7vw, 23px);
    letter-spacing: 0.06em;
    font-weight: 400;
  }
  .where .sep { opacity: 0.5; margin: 0 0.5em; }
  #clock { font-variant-numeric: tabular-nums; }
  .day {
    position: fixed;
    left: max(28px, 3.2vw);
    right: max(28px, 3.2vw);
    bottom: max(14px, 1.9vh);
    height: 14px;
    cursor: ew-resize;
    touch-action: none;
  }
  .day::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 7px;
    height: 1px;
    background: linear-gradient(90deg, rgba(255, 253, 247, 0.15), rgba(255, 253, 247, 0.55) 16%, rgba(255, 253, 247, 0.55) 78%, rgba(255, 253, 247, 0.15));
    box-shadow: 0 0 6px rgba(8, 14, 60, 0.25);
  }
  #sun {
    position: absolute;
    top: 3px;
    width: 9px;
    height: 9px;
    margin-left: -4.5px;
    border-radius: 50%;
    background: #fff4d8;
    box-shadow: 0 0 10px rgba(255, 230, 180, 0.8);
  }
  .edge {
    position: fixed;
    top: 0;
    bottom: 22vh;
    width: 11vw;
    min-width: 56px;
    border: 0;
    background: none;
    color: var(--ink);
    font: 200 44px/1 var(--font);
    text-shadow: var(--shadow);
    opacity: 0;
    transition: opacity 0.35s;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .edge:hover, .edge:focus-visible { opacity: 0.7; outline: none; }
  .edge.prev { left: 0; text-align: left; padding-left: max(22px, 2.6vw); }
  .edge.next { right: 0; text-align: right; padding-right: max(22px, 2.6vw); }
  #hint {
    position: fixed;
    left: 50%;
    top: 46%;
    transform: translate(-50%, -50%);
    font-size: 13px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    text-align: center;
    line-height: 2.1;
    text-shadow: var(--shadow);
    pointer-events: none;
    transition: opacity 1.6s;
  }
  #hint { width: max-content; max-width: 92vw; }
  #hint.gone { opacity: 0; }
  #hint kbd { font: inherit; opacity: 0.7; }
  #hint .keys > span { white-space: nowrap; margin: 0 0.75em; }
  #hint .touch { display: none; }
  .corner {
    position: fixed;
    right: max(28px, 3.2vw);
    bottom: max(30px, 4.2vh);
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    text-shadow: var(--shadow);
  }
  .corner a { color: var(--ink-soft); text-decoration: none; margin-left: 1.8em; }
  .corner a:hover { color: var(--ink); }
  /* The two looks: the one on show in full ink, the other a click away. */
  .looks button {
    font: inherit;
    letter-spacing: inherit;
    text-transform: inherit;
    text-shadow: inherit;
    color: var(--ink-soft);
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .looks button + button::before { content: "/"; margin: 0 0.7em; opacity: 0.55; }
  .looks button:hover, .looks button[aria-pressed="true"] { color: var(--ink); }
  .looks button:focus-visible { outline: 1px solid var(--ink-soft); outline-offset: 3px; }
  /* Over a light ground (sand, a sunlit sidewalk) the caption turns to ink. */
  .bright .caption, .bright .day {
    --ink: rgba(26, 32, 70, 0.86);
    --ink-soft: rgba(26, 32, 70, 0.58);
    --shadow: 0 0 12px rgba(255, 252, 240, 0.45);
  }
  @media (min-width: 641px) {
    .bright .corner {
      --ink: rgba(26, 32, 70, 0.86);
      --ink-soft: rgba(26, 32, 70, 0.58);
      --shadow: 0 0 12px rgba(255, 252, 240, 0.45);
    }
  }
  .bright .day::before { background: linear-gradient(90deg, rgba(26, 32, 70, 0.1), rgba(26, 32, 70, 0.42) 16%, rgba(26, 32, 70, 0.42) 78%, rgba(26, 32, 70, 0.1)); box-shadow: none; }
  .caption, .day::before, .corner a, .looks button { transition: color 0.6s; }
  @media (hover: none) {
    .edge { opacity: 0.45; }
    #hint .keys { display: none; }
    #hint .touch { display: inline; }
  }
  @media (max-width: 640px) {
    .edge { font-size: 34px; }
    #hint { font-size: 11px; width: 80vw; }
    .corner { bottom: auto; top: max(22px, env(safe-area-inset-top)); letter-spacing: 0.22em; }
    .corner a { margin-left: 1.3em; }
    .looks button + button::before { margin: 0 0.5em; }
  }
  @media (prefers-reduced-motion: reduce) {
    #hint, .edge { transition: none; }
  }
</style>
</head>
<body>
<canvas id="paint" aria-label="A painting of a place in Paloma Bay" role="img"></canvas>
<canvas id="fade"></canvas>
<button class="edge prev" id="prev" aria-label="Previous place">&lsaquo;</button>
<button class="edge next" id="next" aria-label="Next place">&rsaquo;</button>
<div class="caption" aria-live="polite">
  <div class="town">Paloma Bay</div>
  <div class="where"><span id="place">&nbsp;</span><span class="sep">&middot;</span><span id="clock">&nbsp;</span></div>
</div>
<nav class="corner"><span class="looks" id="looks" role="group" aria-label="Look"></span><a href="day.html">Film</a><a href="book.html" id="postcards">Postcards</a></nav>
<div class="day" id="day" aria-label="Time of day"><div id="sun"></div></div>
<div id="hint">Drag across the picture to pass the day<br><span class="keys"><span><kbd>&larr; &rarr;</kbd> another place</span> <span><kbd>&uarr; &darr;</kbd> another view</span> <span><kbd>L</kbd> another look</span> <span><kbd>space</kbd> let it pass</span></span><span class="touch">Tap an edge for another place<br>flick up or down for another view</span></div>
